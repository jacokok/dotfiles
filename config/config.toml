[tools]
agent-browser = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
chezmoi = "latest"
claude = "latest"
codex = "latest"
copilot = "latest"
dotnet = "latest"
fnox = "latest"
gh = "latest"
node = "26.9.0"
"npm:@xai-official/grok" = "latest"
opencode = "latest"
pi = "latest"
pnpm = "latest"

[settings.upgrade]
auto_prune = false

[settings]
minimum_release_age_excludes = ["pi"]

[history.origin]
url = "git@github.com:jacokok/dotfiles.git"
branch = "main"

[dotfiles]
"~/.miserc.toml" = { mode = "track", variants = [{ profile = "omarchy" }, { profile = "macos" }] }


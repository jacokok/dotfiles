[tools]
agent-browser = "latest"
"aqua:modem-dev/hunk" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
claude = "latest"
codex = "latest"
cursor-agent = { version = "latest", bin_path = "bin", strip_components = 0, url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(x64="x64", arm64="arm64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }
dotnet = "latest"
fnox = "latest"
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:jacokok/step" = "0.2.0"
"http:muse" = { version = "latest", url = "https://api.meta.ai/muse-launcher.sh", bin = "muse", version_list_url = "https://api.meta.ai/muse-code/channels/muse-stable", version_json_path = ".version" }
node = "26.12.0"
"npm:@xai-official/grok" = "latest"
"npm:donsetch" = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
pnpm = "latest"
uv = "latest"

[settings.upgrade]
auto_prune = false

[settings]
minimum_release_age_excludes = ["pi", "github:jacokok/step"]
